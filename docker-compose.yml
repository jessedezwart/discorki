services:
  caddy:
    image: caddy:2
    profiles:
      - caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - HOST=${HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - discorki

  discorki:
    build: .
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=discorki
      - SPRING_DATASOURCE_USERNAME=discorki
      - SPRING_DATASOURCE_PASSWORD=discorki
      - RIOT_API_KEY=${RIOT_API_KEY}
      - RIOT_PLATFORM_ROUTING=${RIOT_PLATFORM_ROUTING}
      - RIOT_REGIONAL_ROUTING=${RIOT_REGIONAL_ROUTING}
      - RIOT_RATE_LIMIT_PER_TWO_MINUTES=${RIOT_RATE_LIMIT_PER_TWO_MINUTES}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DEVELOPER_DISCORD_ID=${DEVELOPER_DISCORD_ID}
      - APP_HOST=${HOST}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: discorki
      MARIADB_USER: discorki
      MARIADB_PASSWORD: discorki
      MARIADB_ROOT_PASSWORD: discorki
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MARIADB_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
