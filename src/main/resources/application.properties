# Load repo-local environment variables for local development.
spring.config.import=optional:file:.env[.properties]

# database settings
# Override any of these with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD environment variables.
# For local/docker setups, DB_PASSWORD and HOST are also supported as fallbacks.
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/discorki}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:discorki}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:discorki}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.springframework.http.client=DEBUG

# spring misc settings
spring.jpa.open-in-view=false
spring.output.ansi.enabled=always

# riot settings
riot.key=${RIOT_API_KEY}
riot.platformRouting=${RIOT_PLATFORM_ROUTING:euw1}
riot.regionalRouting=${RIOT_REGIONAL_ROUTING:europe}
riot.rate-limit-per-two-minutes=${RIOT_RATE_LIMIT_PER_TWO_MINUTES:100}

# discord settings
discord.token=${DISCORD_BOT_TOKEN}

# custom settings
app.host=${APP_HOST:${HOST:localhost}}
app.developer-discord-ids[0]=${DEVELOPER_DISCORD_ID}
app.summoner-lookup-url=${SUMMONER_LOOKUP_URL:https://op.gg/lol/summoners/euw/%s}
app.match-lookup-url=${MATCH_LOOKUP_URL:https://tracker.gg/lol/match/%s}
